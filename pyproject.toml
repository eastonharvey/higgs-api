[project]
name = "hf_pipeline"
version = "0.1.0"
description = "Budgeted, idempotent, webhook-driven Higgsfield generation pipeline"
requires-python = ">=3.9"
dependencies = ["higgsfield-client>=0.2.0", "python-dotenv>=1.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["hf_pipeline*"]

[tool.setuptools.package-data]
hf_pipeline = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
